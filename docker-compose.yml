services:

  otel-collector:
    image: otel/opentelemetry-collector:0.165.0
    command:
      - "--config=/etc/otelcol/config.yaml"

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - webhook-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: ReliableWebhook.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      ConnectionStrings__WebhookDb: "Server=sql,1433;Database=ReliableWebhookDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5190:8080"
    depends_on:
      sql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: ReliableWebhook.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      ConnectionStrings__WebhookDb: "Server=sql,1433;Database=ReliableWebhookDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  webhook-sql-data: